  - date: '2026-08-30'
    rating: 4
    summary: >-
      Re-profiled under the university pipeline, with operator attribution settled before anything was
      saved. Aalto turns out to run a genuine institution-owned API program, which the June 2026 pass
      under-counted: its 3scale gateway leaves the ActiveDocs index at /api_docs/services.json open
      without credentials, exposing forty-four Aalto-authored Swagger/OpenAPI documents. Five
      production products are documented on the portal (facilities and reservations, SISU courses,
      Acris research publications, projects and cost centres, and a deprecated Oodi course API); the
      contracts for five of them are now saved, every one with servers under *.api.aalto.fi. Every
      gateway endpoint returns 403 "Authentication parameters missing" to an anonymous caller, so the
      contracts are public and the data is not. Two corrections to the June record: the Linked Open
      Aalto Data SPARQL endpoint answers only over POST — a GET times out and its own redirect target
      404s, so a status-code-only probe reads it as dead — and the published Aaltodoc OAI path
      /oai/request now 301s to /server/oai/request under DSpace 9.2. New finds: Aalto's own Shibboleth
      SAML 2.0 identity provider with forty-one Aalto entities registered in the Haka federation, an
      Aalto-run GitLab at version.aalto.fi, the Triton research-computing service, and an institutional
      AI posture with its own assistant at ai.aalto.fi. Acris/Pure, Ex Libris Primo/Alma, Finna and
      Funidata's SISU are recorded as tenant relationships; no vendor contract was saved under Aalto's
      name.
