not_found:
  - standard: scim
    detail: No SCIM 2.0 endpoint or /ServiceProviderConfig found on any Aalto host.
  - standard: lti
    detail: >-
      mycourses.aalto.fi is an Aalto-hosted Moodle and Moodle ships LTI, but no LTI registration,
      platform configuration or tool-configuration document was publicly reachable, so no claim is made.
  - standard: oneroster
    detail: Not found. Finnish student data interchange runs through SISU/Opintopolku, not OneRoster.
  - standard: ed-fi
    detail: Not found — Ed-Fi is a US K-12 ecosystem with no Finnish HE presence.
  - standard: caliper
    detail: Not found.
  - standard: qti
    detail: >-
      exam.aalto.fi (EXAM, the Finnish HE exam system) is registered in Haka but exposes no public
