        endpoint.
    supporting:
      - url: https://haka.funet.fi/metadata/haka-metadata.xml
        status: 200
        location: EntitiesDescriptor/EntityDescriptor/@entityID
        value: 41 entityIDs scoped to Aalto
        detail: >-
          Aalto is a registered member of Haka, Finland's higher-education SAML federation, with one
          IdP (idp.aalto.fi) and forty service providers including mycourses.aalto.fi,
          version.aalto.fi, exam.aalto.fi, wiki.aalto.fi and the cs.aalto.fi teaching services.
          Haka feeds eduGAIN, so these entities are internationally resolvable.

  - standard: orcid
    status: deployed
    operator: institution
    evidence:
      url: https://aaltodoc.aalto.fi/server/api/integration/externalsources
      status: 200
      location: _embedded.externalsources[].id
      value: orcidWorks
