conformance:
  - standard: oai-pmh
    status: conformant
    version: '2.0'
    operator: institution
    evidence:
      url: https://aaltodoc.aalto.fi/server/oai/request?verb=Identify
      status: 200
      location: OAI-PMH/Identify/protocolVersion
      value: '2.0'
      detail: >-
        repositoryName "Aaltodoc publication archive", baseURL
        https://aaltodoc.aalto.fi/server/oai/request, repositoryIdentifier aaltodoc.aalto.fi,
        earliestDatestamp 2011-09-27T11:35:20Z, granularity YYYY-MM-DDThh:mm:ssZ.
    supporting:
      - url: https://aaltodoc.aalto.fi/server/oai/request?verb=ListMetadataFormats
        status: 200
        location: OAI-PMH/ListMetadataFormats/metadataFormat/metadataPrefix
        value: oai_dc, qdc, qdc_finna, qdc_kk, qdc_all, mods, mets, didl, ore, dim, xoai, rdf, marc, rioxx, uketd_dc, etdms
        detail: >-
          Sixteen metadata formats served, including rioxx v3.0 and etdms — an OpenAIRE-oriented
          configuration, not a bare DSpace default.
    note: >-
      The published pointer https://aaltodoc.aalto.fi/oai/request 301s to /server/oai/request under
      DSpace 9.2. Both resolve; the /server path is canonical.

  - standard: saml
    status: conformant
    version: '2.0'
    operator: institution
    evidence:
      url: https://idp.aalto.fi/idp/shibboleth
      status: 200
      location: md:EntityDescriptor/md:IDPSSODescriptor/@protocolSupportEnumeration
      value: urn:oasis:names:tc:SAML:2.0:protocol
      detail: >-
        entityID https://idp.aalto.fi/idp/shibboleth, mdrpi:RegistrationInfo registrationAuthority
        http://www.aalto.fi registered 2019-04-15, mdui:DisplayName "Aalto University", X.509 signing
        certificate issued to CN=idp.aalto.fi, O=Aalto University, OU=IT Services, Espoo, FI.

  - standard: shibboleth
    status: conformant
    operator: institution
    evidence:
      url: https://idp.aalto.fi/idp/shibboleth
      status: 200
      location: md:IDPSSODescriptor/md:Extensions/shibmd:Scope
      value: aalto.fi
      detail: >-
        Shibboleth-specific metadata extensions (shibmd:Scope, mdui:DiscoHints with DomainHint
