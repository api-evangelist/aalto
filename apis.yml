  detail: >-
    Aalto is one of the few institutions in this cohort with a genuine institution-operated API
    program, and it was reachable. Its 3scale gateway leaves the ActiveDocs index
    (/api_docs/services.json) open without credentials, which yielded forty-four Aalto-authored
    contracts; five production products documented on the portal's /docs page are catalogued here
    with their specs saved, all with servers under *.api.aalto.fi. Every gateway endpoint answers an
    anonymous call with 403 "Authentication parameters missing", so the contracts are public and the
    data is gated — that is a real posture, not a coverage failure. Fully anonymous surfaces do exist
    and were verified: Aaltodoc's OAI-PMH 2.0 Identify and its DSpace 9.2 REST root both return 200,
    and the Linked Open Aalto Data SPARQL endpoint returns real Aalto triples. Vendor tenancies
    (Elsevier Pure / Acris, Ex Libris Primo, Finna) are recorded as relationships with x-operator
    tenant and no vendor contract was saved under Aalto's name.
