apis:
  - aid: aalto:api-gateway
    name: Aalto API Gateway
    x-operator: institution
    description: >-
      Aalto's own Red Hat 3scale API gateway, the front door to every institution-operated API at
      Aalto. Five API products are documented on the portal; the underlying ActiveDocs index is public
      and lists forty-four Aalto-authored Swagger/OpenAPI documents, including test and internal
      services that are not published as products. Registration and API-key issuance require an Aalto
      account, so the program is not self-service for outside developers. apiportal.aalto.fi is the
      published front door and redirects here.
    humanURL: https://www.aalto.fi/en/services/api-gateway-application-programming-interface
    baseURL: https://3scale.apps.ocp4.aalto.fi
    tags: [ API Gateway, 3scale, Education, Developer Portal ]
    properties:
