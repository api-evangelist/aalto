aid: aalto
name: Aalto University
x-type: university
x-category: Public Research University
description: >-
  Aalto University is a multidisciplinary public research university in Espoo, Finland, formed in 2010
  from the merger of the Helsinki University of Technology, the Helsinki School of Economics and the
  University of Art and Design Helsinki. Unusually for this cohort, Aalto operates a real
  institution-owned API program rather than only a set of vendor tenancies: the Aalto API Gateway
  (Red Hat 3scale, at 3scale.apps.ocp4.aalto.fi) publishes five documented API products — facilities
  and room reservations, SISU course data, Acris research publications, projects and cost centres,
  and a deprecated Oodi-sourced course API — and its ActiveDocs index is publicly readable, exposing
  forty-four Aalto-authored Swagger/OpenAPI documents whose servers all sit under *.api.aalto.fi.
  Every one of those endpoints is API-key gated and returns 403 to an anonymous caller, so the
  contracts are public while the data is not. The genuinely anonymous surfaces are elsewhere: the
  Aaltodoc institutional repository (Aalto-hosted DSpace 9.2) serves a live OAI-PMH 2.0 endpoint with
  sixteen metadata formats and an open REST API, and the Linked Open Aalto Data SPARQL endpoint
  answers real queries — but only over POST, since GET times out. Aalto also runs its own Shibboleth
  SAML 2.0 identity provider and is registered in the Haka federation with forty-one entities, which
  is machine-readable institutional infrastructure that almost no university in this cohort
  catalogues. Its library discovery, research information system and research portal are vendor
  tenancies (Ex Libris, Elsevier Pure) and are recorded as relationships, not as Aalto's engineering.
