  - aid: aalto:facilities
    name: Aalto Facilities API
    x-operator: institution
    description: >-
      Buildings, building details, opening hours, rooms and room reservations across Aalto's Espoo
      campus. OpenAPI 3.0.1, version 1.0.2, contact it-integ@aalto.fi, served from
      facilities.api.aalto.fi. Documented on the portal as "Facilities API : Buildings and
      Reservations". The contract declares no securityScheme, but the gateway rejects an anonymous
      call with 403 — a real gap between the documented and deployed auth surface.
    humanURL: https://3scale.apps.ocp4.aalto.fi/docs/swagger/facilities2
    baseURL: https://facilities.api.aalto.fi/api/aalto
    tags: [ Facilities, Buildings, Room Booking, Campus, Reservations ]
