        url: https://3scale.apps.ocp4.aalto.fi/docs/swagger/facilities2

  - aid: aalto:course-sisu
    name: Aalto Course API (SISU)
    x-operator: institution
    description: >-
      Course units and course-unit realisations drawn from SISU, the Finnish higher-education student
      information system Aalto runs. OpenAPI 3.0.1, version 0.0.18, titled "Sisu API (replaces
      /oodiapi)" — the designated replacement for the deprecated Oodi-sourced Course API. Served from
      course.api.aalto.fi with a USER_KEY query-string API key. The contract is Aalto's own gateway
      contract; SISU itself is a Funidata product Aalto operates as a tenant.
    humanURL: https://3scale.apps.ocp4.aalto.fi/docs/swagger/open_courses_sisu
    baseURL: https://course.api.aalto.fi/api/sisu/v1
    tags: [ Course Catalog, SISU, Students, Education, Registrar ]
    properties:
      - type: OpenAPI
        url: openapi/aalto-course-sisu-api-openapi.yml
      - type: JSONSchema
        url: json-schema/aalto-course-sisu-api-schema.json
      - type: Documentation
        url: https://3scale.apps.ocp4.aalto.fi/docs/swagger/open_courses_sisu

  - aid: aalto:acris-research
    name: Aalto Research Publications API (Acris gateway)
    x-operator: institution
    description: >-
      Aalto's own four-path gateway contract over Acris, its research information system, exposing
      research outputs, a single output by id, an enhanced output view and output fingerprints.
      OpenAPI 3.0.0 served from research.api.aalto.fi with a USER-KEY header. This is Aalto's wrapper,
      not Elsevier's contract: the underlying Acris/Pure web service at acris.aalto.fi/ws/api is a
      separate tenant surface recorded below, and its generic Pure specification is deliberately NOT
      saved under Aalto's name. info.version reads "Pure v5.15/" because it names the upstream release
      being wrapped.
    humanURL: https://3scale.apps.ocp4.aalto.fi/docs/swagger/research
    baseURL: https://research.api.aalto.fi/api/acris/v1
    tags: [ Research, Publications, Research Data, CRIS, Open Access ]
    properties:
      - type: OpenAPI
        url: openapi/aalto-acris-research-api-openapi.yml
      - type: Documentation
        url: https://3scale.apps.ocp4.aalto.fi/docs/swagger/research

  - aid: aalto:projects-costcenters
    name: Aalto Projects and Cost Centers API
    x-operator: institution
    description: >-
      Administrative reference data — cost centres, projects, departments and schools — from Aalto's
      data warehouse. OpenAPI 3.0.0, version 1.0.10, X-ApiKey header, served from api.aalto.fi. The
      contract still carries Swagger's sample-project boilerplate (contact apiteam@swagger.io,
      termsOfService swagger.io) which was never replaced; the servers are Aalto's own.
    humanURL: https://3scale.apps.ocp4.aalto.fi/docs/swagger/projectscostcenters
    baseURL: https://api.aalto.fi/api/dw_projects
    tags: [ Administration, Finance, Organization, Reference Data ]
    properties:
      - type: OpenAPI
        url: openapi/aalto-projects-costcenters-api-openapi.yml
      - type: Documentation
        url: https://3scale.apps.ocp4.aalto.fi/docs/swagger/projectscostcenters

  - aid: aalto:people-profile
    name: Aalto People Profile API
    x-operator: institution
    description: >-
      A two-path proxy over Aaltopeople returning groups and public staff profiles. OpenAPI 3.0.1,
      version 1.0.3, contact it-integ@aalto.fi, served from aaltopeople.api.aalto.fi. Present in the
      public ActiveDocs index but not published as a product on the portal's documentation page.
      Gateway-gated: 403 to an anonymous caller.
    baseURL: https://aaltopeople.api.aalto.fi/api/aaltopeople/v1
    tags: [ Directory, People, Organization, Campus ]
    properties:
      - type: OpenAPI
        url: openapi/aalto-people-profile-api-openapi.yml

  - aid: aalto:course-oodi-deprecated
    name: Aalto Open API — Course API (Oodi, deprecated)
    x-operator: institution
    description: >-
      The Oodi-sourced course API, still published on the portal and explicitly marked deprecated:
      "This API source is OODI and should not be used." Swagger 2.0, two paths, superseded by the
      SISU Course API. Recorded as a real lifecycle event — one of the few observable deprecations in
      this cohort — with no spec saved, because Aalto tells callers not to use it. The deprecation is
      signalled only in prose; no operation carries deprecated:true and no Sunset policy is published.
    humanURL: https://3scale.apps.ocp4.aalto.fi/docs/swagger/courses
    tags: [ Course Catalog, Deprecated, Oodi, Education ]
    properties:
      - type: Documentation
        url: https://3scale.apps.ocp4.aalto.fi/docs/swagger/courses
      - type: Lifecycle
        url: lifecycle/aalto-lifecycle.yml

  - aid: aalto:aaltodoc
    name: Aaltodoc Repository — OAI-PMH and DSpace REST
    x-operator: institution
    description: >-
      Aalto's institutional repository of theses, articles and conference publications, running
      Aalto-hosted DSpace 9.2 on aaltodoc.aalto.fi. Both read surfaces are fully anonymous and were
      verified live: an OAI-PMH 2.0 endpoint (repositoryIdentifier aaltodoc.aalto.fi, earliest
      datestamp 2011-09-27, sixteen metadata formats including rioxx v3.0 and etdms) and a HAL-style
      DSpace REST API. DSpace is open-source software Aalto self-hosts, so this is institution-run
      infrastructure rather than a vendor tenancy. The historically published OAI path /oai/request
      now 301s to /server/oai/request.
    humanURL: https://www.aalto.fi/en/open-science-and-research/aaltodoc-publication-archive
    baseURL: https://aaltodoc.aalto.fi/server/oai/request
    tags: [ Repository, OAI-PMH, DSpace, Research Data, Open Access, Theses ]
    properties:
      - type: Documentation
        url: https://www.aalto.fi/en/open-science-and-research/aaltodoc-publication-archive
      - type: APIReference
        url: https://aaltodoc.aalto.fi/server/api
      - type: Conformance
        url: conformance/aalto-conformance.yml

  - aid: aalto:identity-federation
    name: Aalto Shibboleth Identity Provider (Haka / eduGAIN)
    x-operator: institution
    description: >-
      Aalto's own Shibboleth SAML 2.0 identity provider, entityID https://idp.aalto.fi/idp/shibboleth,
      scope aalto.fi, registration authority http://www.aalto.fi registered 2019-04-15. The metadata
      is publicly served and machine-readable. Aalto is a registered member of Haka, Finland's
      higher-education federation, with forty-one entities — one IdP and forty service providers
      spanning mycourses.aalto.fi, version.aalto.fi, exam.aalto.fi, wiki.aalto.fi and the cs.aalto.fi
      teaching estate — and Haka feeds eduGAIN, making those entities internationally resolvable.
      Institution-operated by definition and rarely catalogued anywhere.
    baseURL: https://idp.aalto.fi/idp/shibboleth
    tags: [ Identity Federation, SAML, Shibboleth, Haka, eduGAIN, Single Sign-On ]
    properties:
      - type: IdentityFederation
        url: https://idp.aalto.fi/idp/shibboleth
      - type: Conformance
        url: conformance/aalto-conformance.yml

  - aid: aalto:linked-open-data
    name: Linked Open Aalto Data (SPARQL)
    x-operator: tenant
    description: >-
      Aalto's open data published as Linked Data — courses, people, publications, places, projects,
      organisation and events — under data.aalto.fi URIs. The landing page and dataset descriptions
      are on Aalto's own host, but the SPARQL endpoint runs on the shared Linked Data Finland platform
      (ldf.fi), which serves many Finnish organisations, so the query service is a tenancy. Probed
      2026-08-30: a POST query returns real data.aalto.fi triples, while a GET query times out and the
      endpoint's own redirect target 404s — the service is live but only over POST, and only the
      status code would have hidden that. data.aalto.fi/data and /dataset return 503, so the Linked
      Data browser is partly down.
    humanURL: https://data.aalto.fi/
    baseURL: http://ldf.fi/loa/sparql
    tags: [ Open Data, Linked Data, SPARQL, RDF, Research Data ]
    properties:
      - type: Documentation
        url: https://data.aalto.fi/
      - type: OpenData
        url: https://data.aalto.fi/

  - aid: aalto:acris-pure
    name: Acris — Aalto Current Research Information System (Elsevier Pure)
    x-operator: tenant
    description: >-
      Aalto's research information system is Elsevier Pure, deployed as Acris at acris.aalto.fi with
      the Pure Portal at research.aalto.fi. The data and the DOIs are Aalto's; the contract is
      Elsevier's. The Pure web service at acris.aalto.fi/ws/api returns 401 and its api-docs are
      credential-gated. Recorded as the tenant relationship it is — Elsevier's generic Pure
      specification is deliberately not saved under Aalto's name. Aalto's own four-path gateway
      wrapper over this data is catalogued separately as aalto:acris-research.
    humanURL: https://research.aalto.fi/
    baseURL: https://acris.aalto.fi/ws/api
    tags: [ Research, CRIS, Elsevier Pure, Research Data, Tenant ]
    properties:
      - type: ResearchRepository
        url: https://research.aalto.fi/

  - aid: aalto:library-discovery
    name: Aalto Learning Centre discovery (Ex Libris Primo / Alma, Finna)
    x-operator: tenant
    description: >-
      Library discovery and the library management system are Ex Libris products under Aalto tenancies
      — primo.aalto.fi resolves to the Primo NDE interface with view 358AALTO_INST:MAIN, and
      aalto.alma.exlibrisgroup.com is registered as an Aalto service provider in Haka. Aalto also runs
      a view on Finna, the Finnish national discovery platform operated by the National Library of
      Finland, at aalto.finna.fi; that host bot-challenges at 403, which is a finding about the edge,
      not about Aalto. No vendor contract is saved.
    humanURL: https://primo.aalto.fi/
    tags: [ Library, Discovery, Ex Libris, Primo, Finna, Tenant ]
    properties:
      - type: LibraryCatalog
        url: https://primo.aalto.fi/

  - aid: aalto:sisu-sis
    name: SISU student information system (Funidata)
    x-operator: tenant
    description: >-
      sisu.aalto.fi is Aalto's deployment of SISU, the student information system built by Funidata,
      a company jointly owned by Finnish universities. It is the system of record behind the SISU
      Course API on Aalto's gateway. The student-facing course search is publicly browsable; the
      product contract belongs to Funidata, so only the tenancy is recorded here.
    humanURL: https://sisu.aalto.fi/student/search/main
    tags: [ Course Catalog, Student Information System, SISU, Funidata, Tenant ]
    properties:
      - type: CourseCatalog
        url: https://sisu.aalto.fi/student/search/main

