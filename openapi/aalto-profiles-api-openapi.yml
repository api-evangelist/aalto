openapi: 3.2.0
info:
  title: Aalto people profile Profiles API
  description: Proxy for Aaltopeople API, used to fetch groups or people.
  termsOfService: http://swagger.io/terms/
  contact:
    email: it-integ@aalto.fi
  version: 1.0.3
servers:
- url: https://aaltopeople.api.aalto.fi/api/aaltopeople/v1
tags:
- name: Profiles
paths:
  /profiles:
    get:
      summary: get user profile
      operationId: getExample
      parameters:
      - name: id
        in: query
        schema:
          type: string
      - name: email
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Example
          content: {}
      tags:
      - Profiles
